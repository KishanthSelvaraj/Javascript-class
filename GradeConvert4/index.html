<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Grade Calculator</title>
</head>

<body>
    <div id="wrapper">
        <h2>Grade Calculator</h2>
        <div class="inputdiv">
            <input type="text" id="input" placeholder="Enter the Mark">
        </div>
        <div>
            <button type="submit" onclick="grade()">Convert to Grade</button>
        </div>
        <div id="result">

        </div>
        <script>
            function grade() {
                let mark = document.getElementById("input").value
                let grade = ""
                if (mark >= 90) {
                    grade = "O"
                } else if (mark >= 70 && mark < 90) {
                    grade = "A"
                } else if (mark > 50 && mark < 70) {
                    grade = "B"
                } else if (mark === 50) {
                    grade = "C"
                } else {
                    grade = "RA"
                }
                console.log(grade);
                let result = document.getElementById("result")
                result.innerHTML = `You got ${grade} Grade`


            }


        </script>
</body>

</html>
